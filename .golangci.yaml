version: "2"

# Prefer fixing findings or a //nolint with a reason over new settings.
linters:
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - containedctx
    - contextcheck
    - durationcheck
    - errchkjson
    - errorlint
    - exhaustive
    - exptostd
    - fatcontext
    - forcetypeassert
    - gocritic
    - gomoddirectives
    - goprintffuncname
    - gosec
    - makezero
    - modernize
    - musttag
    - nilerr
    - nilnil
    - noctx
    - nolintlint
    - protogetter
    - reassign
    - revive
    - testifylint
    - unparam
    - usetesting
  settings:
    modernize:
      disable:
        # Suggests changing json tags; keep the existing wire format as written.
        - omitzero
    revive:
      enable-default-rules: true
      rules:
        # Naming style only; renames churn code and break importers of exported names.
        - name: var-naming
          disabled: true
        - name: exported
          disabled: true
        # Exported API shape; changing return types breaks importers.
        - name: unexported-return
          disabled: true
    gomoddirectives:
      replace-allow-list:
        - github.com/coreos/ignition/v2 # Flatcar fork
    govet:
      enable:
        - nilness
        - shadow
    gosec:
      excludes:
        - G104 # duplicates errcheck
      # Node directories are read by other services; flag only modes wider than this.
      config:
        G301: "0755"
    nolintlint:
      require-explanation: true
      require-specific: true
    testifylint:
      disable:
        - require-error # too noisy for tests
  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Keep test linting low-noise.
      - path: _test\.go
        linters:
          - gosec
          - noctx
          - protogetter
          - revive

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    - goimports
