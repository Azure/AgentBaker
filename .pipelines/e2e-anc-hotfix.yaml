name: $(Date:yyyyMMdd)$(Rev:.r)
# Targeted regression gate for the ANC hotfix flow.
#
# The full Linux suite (.pipelines/e2e.yaml) only triggers on e2e/** changes, so a PR that
# edits aks-node-controller or the launcher/hotfix shell glue can break the
# check-hotfix -> download-hotfix -> stage -> select -> provision chain without any E2E
# coverage running. This pipeline closes that gap without widening the full suite's path
# trigger, which would run every Linux scenario on every ANC change.
#
# TAGS_TO_RUN uses Name= filters, which the runner ORs together, so only the two ANC hotfix
# flow scenarios allocate VM resources here.
variables:
  TAGS_TO_RUN: "Name=Ubuntu2204_ANCHotfixFlow,Name=AzureLinuxV3_ANCHotfixFlow"
  SKIP_E2E_TESTS: false
  E2E_GO_TEST_TIMEOUT: "60m"
  E2E_FAILED_TESTS_RETRY_COUNT: 0
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - aks-node-controller/**
      - parts/linux/cloud-init/artifacts/aks-node-controller-launcher.sh
      - parts/linux/cloud-init/artifacts/aks-node-controller-hotfix.sh
      - e2e/scenario/scenario_anc_hotfix.go
      - .pipelines/e2e-anc-hotfix.yaml
      - .pipelines/templates/e2e-template.yaml
pr:
  branches:
    include:
      - official/*
      - main
  paths:
    include:
      - aks-node-controller/**
      - parts/linux/cloud-init/artifacts/aks-node-controller-launcher.sh
      - parts/linux/cloud-init/artifacts/aks-node-controller-hotfix.sh
      - e2e/scenario/scenario_anc_hotfix.go
      - .pipelines/e2e-anc-hotfix.yaml
      - .pipelines/templates/e2e-template.yaml
jobs:
  - template: ./templates/e2e-template.yaml
    parameters:
      name: ANC Hotfix Flow Tests
      IgnoreScenariosWithMissingVhd: false
      jobTimeoutInMinutes: 75
      failedTestsRetryCount: ${{ variables.E2E_FAILED_TESTS_RETRY_COUNT }}
