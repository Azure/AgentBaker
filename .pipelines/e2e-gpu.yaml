name: $(Date:yyyyMMdd)$(Rev:.r)
variables:
  SKIP_E2E_TESTS: false
  SKIP_TESTS_WITH_SKU_CAPACITY_ISSUE: true
  E2E_GO_TEST_TIMEOUT: "75m"
  E2E_FAILED_TESTS_RETRY_COUNT: 2
  DISABLE_SCRIPTLESS_COMPILATION: true
schedules:
  - cron: "0 9 * * *"
    displayName: Daily 1am PST
    branches:
      include:
        - main
    always: true
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - e2e/**
      - '**/*.go'
pr:
  branches:
    include:
      - official/*
      - windows/*
      - main
  paths:
    include:
      - e2e/**
      - '**/*.go'
stages:
  - stage: UbuntuGPU
    displayName: Ubuntu GPU
    variables:
      TAGS_TO_RUN: "gpu=true"
      TAGS_TO_SKIP: "os=windows,os=azurelinux,os=azurecontainerlinux"
    jobs:
      - template: ./templates/e2e-template.yaml
        parameters:
          name: Ubuntu GPU Tests
          IgnoreScenariosWithMissingVhd: false
          jobTimeoutInMinutes: 120
          failedTestsRetryCount: ${{ variables.E2E_FAILED_TESTS_RETRY_COUNT }}

  - stage: AzureLinuxAndACLGPU
    displayName: Azure Linux and ACL GPU
    dependsOn: UbuntuGPU
    condition: always()
    variables:
      TAGS_TO_RUN: "gpu=true"
      TAGS_TO_SKIP: "os=windows,os=ubuntu"
    jobs:
      - template: ./templates/e2e-template.yaml
        parameters:
          name: Azure Linux and ACL GPU Tests
          IgnoreScenariosWithMissingVhd: false
          jobTimeoutInMinutes: 120
          failedTestsRetryCount: ${{ variables.E2E_FAILED_TESTS_RETRY_COUNT }}
          jobCondition: "and(always(), ne(variables.SKIP_E2E_TESTS, 'true'))"
