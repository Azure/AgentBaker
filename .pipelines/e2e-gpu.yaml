name: $(Date:yyyyMMdd)$(Rev:.r)
parameters:
  - name: tagsToRun
    type: string
    default: "gpu=true"
variables:
  TAGS_TO_RUN: ${{ parameters.tagsToRun }}
  TAGS_TO_SKIP: "os=windows,os=azurelinux,os=azurecontainerlinux"
  SKIP_E2E_TESTS: false
  # PRs skip quota/capacity-constrained scenarios; main and scheduled runs fail them.
  SKIP_TESTS_WITH_SKU_CAPACITY_ISSUE: $[eq(variables['Build.Reason'], 'PullRequest')]
  E2E_GO_TEST_TIMEOUT: "75m"
  E2E_FAILED_TESTS_RETRY_COUNT: 2
  DISABLE_SCRIPTLESS_COMPILATION: true
schedules:
  - cron: "0 9 * * *"
    displayName: Daily 1am PST
    branches:
      include:
        - main
        - dev
    always: true
trigger:
  branches:
    include:
      - main
      - dev
  paths:
    include:
      - e2e/**
      - '**/*.go'
pr:
  branches:
    include:
      - official/*
      - windows/*
      - main
      - dev
  paths:
    include:
      - e2e/**
      - '**/*.go'
jobs:
  # Keep the scheduled run at 09:00 UTC, but give existing dev GPU runs time
  # to finish before starting tests. Other run reasons do not use this gate.
  - ${{ if and(eq(variables['Build.Reason'], 'Schedule'), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
    - job: wait_for_dev_gpu_runs
      displayName: Wait for active dev GPU runs
      condition: and(succeeded(), ne(variables.SKIP_E2E_TESTS, 'true'))
      variables:
        - group: ab-e2e
      pool:
        name: $(E2E_POOL_NAME)
      timeoutInMinutes: 185
      steps:
        - checkout: self
          fetchTags: false
          fetchDepth: 1
        - bash: bash .pipelines/scripts/wait_for_dev_runs.sh
          displayName: Wait for dev GPU runs to finish
          env:
            SYSTEM_ACCESSTOKEN: $(System.AccessToken)
            # Agentbaker GPU E2E and Agentbaker Azure Linux GPU E2E share quota.
            DEV_PIPELINE_DEFINITION_IDS: "443878,474207"
            DEV_RUN_WAIT_TIMEOUT_SECONDS: "10800"

  - template: ./templates/e2e-template.yaml
    parameters:
      ${{ if and(eq(variables['Build.Reason'], 'Schedule'), eq(variables['Build.SourceBranch'], 'refs/heads/main')) }}:
        dependsOn: [wait_for_dev_gpu_runs]
      name: Ubuntu GPU Tests
      IgnoreScenariosWithMissingVhd: false
      jobTimeoutInMinutes: 180
      failedTestsRetryCount: ${{ variables.E2E_FAILED_TESTS_RETRY_COUNT }}
