name: $(Date:yyyyMMdd)$(Rev:.r)
variables:
  TAGS_TO_RUN: "gpu=true"
  TAGS_TO_SKIP: "os=windows,os=azurelinux,os=azurecontainerlinux"
  SKIP_E2E_TESTS: false
  # PRs skip quota/capacity-constrained scenarios; main and scheduled runs fail them.
  SKIP_TESTS_WITH_SKU_CAPACITY_ISSUE: $[eq(variables['Build.Reason'], 'PullRequest')]
  E2E_GO_TEST_TIMEOUT: "75m"
  E2E_FAILED_TESTS_RETRY_COUNT: 2
  DISABLE_SCRIPTLESS_COMPILATION: true
schedules:
  - cron: "0 9 * * *"
    displayName: Daily 1am PST
    branches:
      include:
        - main
    always: true
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - e2e/**
      - '**/*.go'
      - .pipelines/e2e-gpu.yaml
      - parts/linux/cloud-init/artifacts/cse_config_gpu.sh
      - parts/linux/cloud-init/artifacts/cse_helpers.sh
      - parts/linux/cloud-init/artifacts/cse_start.sh
      - parts/linux/cloud-init/artifacts/ubuntu/cse_install_ubuntu.sh
      - vhdbuilder/packer/install-dependencies.sh
pr:
  branches:
    include:
      - official/*
      - windows/*
      - main
  paths:
    include:
      - e2e/**
      - '**/*.go'
      - .pipelines/e2e-gpu.yaml
      - parts/linux/cloud-init/artifacts/cse_config_gpu.sh
      - parts/linux/cloud-init/artifacts/cse_helpers.sh
      - parts/linux/cloud-init/artifacts/cse_start.sh
      - parts/linux/cloud-init/artifacts/ubuntu/cse_install_ubuntu.sh
      - vhdbuilder/packer/install-dependencies.sh
jobs:
  - template: ./templates/e2e-template.yaml
    parameters:
      name: Ubuntu GPU Tests
      IgnoreScenariosWithMissingVhd: false
      jobTimeoutInMinutes: 180
      failedTestsRetryCount: ${{ variables.E2E_FAILED_TESTS_RETRY_COUNT }}
