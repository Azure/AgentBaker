name: $(Date:yyyyMMdd)$(Rev:.r)
variables:
  TAGS_TO_RUN: "Name=Ubuntu2204_GPUNC,Name=Ubuntu2204_GPUA10,Name=Ubuntu2204_GPUNoDriver,Name=Ubuntu2204_GPUNC_ValidateDriver,Name=Ubuntu2404_GPUNC_ValidateDriver,Name=Ubuntu2404Gen2_GPUNoDriver,Name=Ubuntu2404_NvidiaDevicePluginRunning"
  TAGS_TO_SKIP: "os=windows,os=azurelinux,os=azurecontainerlinux"
  SKIP_E2E_TESTS: false
  # Test-only branch: pin both producer images and consumer script delivery.
  VHD_BUILD_ID: "183969331"
  DISABLE_SCRIPTLESS: true
  SKIP_TESTS_WITH_SKU_CAPACITY_ISSUE: false
  E2E_GO_TEST_TIMEOUT: "75m"
  E2E_FAILED_TESTS_RETRY_COUNT: 1
  DISABLE_SCRIPTLESS_COMPILATION: true
schedules:
  - cron: "0 9 * * *"
    displayName: Daily 1am PST
    branches:
      include:
        - main
    always: true
trigger:
  branches:
    include:
      - main
  paths:
    include:
      - e2e/**
      - '**/*.go'
pr:
  branches:
    include:
      - official/*
      - windows/*
      - main
  paths:
    include:
      - e2e/**
      - '**/*.go'
jobs:
  - template: ./templates/e2e-template.yaml
    parameters:
      name: Ubuntu GPU Tests
      IgnoreScenariosWithMissingVhd: false
      jobTimeoutInMinutes: 180
      failedTestsRetryCount: ${{ variables.E2E_FAILED_TESTS_RETRY_COUNT }}
