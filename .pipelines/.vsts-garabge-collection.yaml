parameters:
- name: DRY_RUN
  displayName: Dry Run
  type: boolean
  default: false
- name: STANDARD_RETENTION_SECONDS
  displayName: Standard retention in seconds (default 4 hours)
  type: number
  default: 14400
- name: SKIP_RETENTION_SECONDS
  displayName: Retention for gc.skip=true groups in seconds (default 7 days)
  type: number
  default: 604800

schedules:
- cron: '0 */4 * * *'
  displayName: Scheduled Garbage Collection
  always: true
  branches:
    include:
      - main

pool:
  name: $(POOL_NAME)

jobs:
- job: gc
  displayName: Garbage Collection
  steps:
    - checkout: self
      fetchTags: false
      fetchDepth: 1

    - task: AzureCLI@2
      inputs:
        azureSubscription: $(ARM_SERVICE_CONNECTION)
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          chmod +x ./vhdbuilder/scripts/gc.sh
          ./vhdbuilder/scripts/gc.sh
      env:
        SUBSCRIPTION_ID: $(SUBSCRIPTION_ID)
        DRY_RUN: ${{ parameters.DRY_RUN }}
        STANDARD_RETENTION_SECONDS: ${{ parameters.STANDARD_RETENTION_SECONDS }}
        SKIP_RETENTION_SECONDS: ${{ parameters.SKIP_RETENTION_SECONDS }}
      displayName: Garbage collect resource groups
