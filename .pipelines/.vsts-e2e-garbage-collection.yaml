trigger: none
pr: none

parameters:
  - name: DRY_RUN
    displayName: Run in dry-run mode
    type: boolean
    default: false
  - name: NO_WAIT
    displayName: Wait for resource deletion
    type: boolean
    default: false

pool:
  name: $(POOL_NAME)

stages:
  - stage: e2e_gc_msft
    displayName: MSFT Tenant
    dependsOn: []
    timeoutInMinutes: 720
    jobs:
      - template: ./templates/e2e-gc-template.yaml
        parameters:
          ARM_SERVICE_CONNECTION: $(MSFT_ARM_SERVICE_CONNECTION)
          SUBSCRIPTION_ID: $(MSFT_E2E_SUBSCRIPTION_ID)
          DRY_RUN: ${{ parameters.DRY_RUN }}
          NO_WAIT: ${{ parameters.NO_WAIT }}

  - stage: e2e_gc_tme
    displayName: TME Tenant
    dependsOn: []
    timeoutInMinutes: 360
    jobs:
      - template: ./templates/e2e-gc-template.yaml
        parameters:
          ARM_SERVICE_CONNECTION: $(TME_ARM_SERVICE_CONNECTION)
          SUBSCRIPTION_ID: $(TME_E2E_SUBSCRIPTION_ID)
          DRY_RUN: ${{ parameters.DRY_RUN }}
          NO_WAIT: ${{ parameters.NO_WAIT }}
