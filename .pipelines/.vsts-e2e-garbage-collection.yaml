parameters:
  - name: DRY_RUN
    type: boolean
    default: false
  - name: NO_WAIT
    type: boolean
    default: false

pool:
  name: $(POOL_NAME)

stages:
  - stage: e2e_gc_msft
    displayName: MSFT Tenant
    jobs:
      - template: ./templates/e2e-gc-template.yaml
        parameters:
          ARM_SERVICE_CONNECTION: $(MSFT_ARM_SERVICE_CONNECTION)
          DRY_RUN: ${{ parameters.DRY_RUN }}
          NO_WAIT: ${{ parameters.NO_WAIT }}

  - stage: e2e_gc_tme
    displayName: TME Tenant
    jobs:
      - template: $(TME_ARM_SERVICE_CONNECTION)
        parameters:
          ARM_SERVICE_CONNECTION: ab-e2e-tme
          DRY_RUN: ${{ parameters.DRY_RUN }}
          NO_WAIT: ${{ parameters.NO_WAIT }}
