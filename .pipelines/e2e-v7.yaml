name: $(Date:yyyyMMdd)$(Rev:.r)
variables:
  TAGS_TO_RUN: "vmSeriesCoverageTest=true"
  TAGS_TO_SKIP: "os=windows,gpu=true"
  SKIP_E2E_TESTS: false
  E2E_FAILED_TESTS_RETRY_COUNT: 0

schedules:
  - cron: "0 8 * * *"
    displayName: Daily midnight PST
    branches:
      include:
        - main
    always: true

trigger:
  branches:
    include:
      - main
  paths:
    include:
      - e2e/**
      - '**/*.go'

pr:
  branches:
    include:
      - official/*
      - windows/*
      - main
  paths:
    include:
      - e2e/**
      - '**/*.go'

jobs:
  - template: ./templates/e2e-template.yaml
    parameters:
      name: V7 Tests
      IgnoreScenariosWithMissingVhd: false
      failedTestsRetryCount: ${{ variables.E2E_FAILED_TESTS_RETRY_COUNT }}
      matrix:
        Intel_V7:
          DEFAULT_VM_SKU: "Standard_D2ds_v7"
        AMD_V7:
          DEFAULT_VM_SKU: "Standard_D2ads_v7"
