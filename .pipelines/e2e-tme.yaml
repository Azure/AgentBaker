name: $(Date:yyyyMMdd)$(Rev:.r)
parameters:
  - name: cosiArtifactsBuildID
    displayName: Registered VHD build ID supplying the COSI target
    type: string
    default: ""
  - name: e2eVariableGroup
    displayName: E2E variable group
    type: string
    default: ab-e2e-tme

variables:
  - name: SKIP_E2E_TESTS
    value: false
  - name: E2E_FAILED_TESTS_RETRY_COUNT
    value: 2
  - group: "AKS Node SIG - PMC COSI TME"

jobs:
  - template: ./templates/e2e-template.yaml
    parameters:
      name: Linux Tests
      IgnoreScenariosWithMissingVhd: false
      jobTimeoutInMinutes: 120
      failedTestsRetryCount: ${{ variables.E2E_FAILED_TESTS_RETRY_COUNT }}
      variableGroup: ${{ parameters.e2eVariableGroup }}
      subscriptionId: ""
      cosiArtifactsBuildID: ${{ parameters.cosiArtifactsBuildID }}
      cosiNebraskaServer: "$(NEBRASKA_PUBLISHER_ENDPOINT)v1/update"
      cosiNebraskaAppID: $(NEBRASKA_APP_ID)
      cosiArtifactNames:
        - ${{ if ne(parameters.cosiArtifactsBuildID, '') }}:
          - "cosi-publishing-info-acl-tl-gen2"
