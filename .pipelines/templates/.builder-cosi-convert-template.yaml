# Steps for the native-arm64 ACL COSI conversion job.
#
# ACL COSI conversion runs ImageCustomizer, which mounts the image's btrfs rootfs
# and enumerates subvolumes. Those btrfs ioctls are not supported under qemu-user
# emulation, so the arm64 conversion cannot run on the x86_64 build pool. Instead,
# the x86_64 build job stages the VHD in blob storage and skips COSI, and this
# template runs on the native arm64 pool to download that staged VHD, convert it,
# upload the COSI to PMC, publish the info artifact, and copy the VHD to immutable
# storage (mirroring what the build job does inline for x64 ACL).
#
# The consuming job must set the ACL build variables (OS_SKU, OS_VERSION,
# HYPERV_GENERATION, ARCHITECTURE, IMG_CUSTOMIZER_CONTAINER, etc.) and provide
# CAPTURED_SIG_VERSION (from the build job's exportCapturedSigVersion output).
parameters:
  - name: artifactName
    type: string

steps:
  - bash: |
      SKU_NAME=${OS_VERSION} && \
      if [[ "${HYPERV_GENERATION,,}" == "v2" ]]; then SKU_NAME="${SKU_NAME}gen2"; fi && \
      if [[ "${ARCHITECTURE,,}" == "arm64" ]]; then SKU_NAME="${SKU_NAME}arm64"; fi && \
      if grep -q "NVIDIA_GB" <<< "$FEATURE_FLAGS"; then SKU_NAME="${SKU_NAME}gb"; fi && \
      if [[ "${ENABLE_FIPS,,}" == "true" ]]; then SKU_NAME="${SKU_NAME}fips"; fi && \
      if grep -q "cvm" <<< "$FEATURE_FLAGS"; then SKU_NAME="${SKU_NAME}CVM"; fi && \
      if [[ "${IMG_SKU}" == *"minimal"* ]]; then SKU_NAME="${SKU_NAME}minimal"; fi && \
      if [[ "${ENABLE_TRUSTED_LAUNCH}" == "True" ]]; then SKU_NAME="${SKU_NAME}TL"; fi && \
      SKU_NAME=$(echo ${SKU_NAME} | tr -d '.') && \
      echo "##vso[task.setvariable variable=SKU_NAME]$SKU_NAME"
      echo "Set SKU_NAME to $SKU_NAME"
    displayName: Set SKU Name

  - bash: |
      echo "##vso[task.setvariable variable=DESTINATION_STORAGE_CONTAINER]${CLASSIC_BLOB_STAGING}"
      echo "DESTINATION_STORAGE_CONTAINER is set to ${CLASSIC_BLOB_STAGING}"
    displayName: Set Destination Storage Container to Staging

  - task: AzureCLI@2
    inputs:
      azureSubscription: $(VHD_ARM_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        make -f packer.mk convert-vhd-to-cosi
    condition: and(succeeded(), eq(variables.GENERATE_PUBLISHING_INFO, 'True'))
    displayName: Convert ACL VHD to COSI
    env:
      RESOURCE_GROUP_NAME: $(AZURE_RESOURCE_GROUP_NAME)
      OFFER_NAME: $(OS_SKU)
      IMG_CUSTOMIZER_ALLOW_FALLBACK: "true"
      AFD_DOWNLOAD_HOSTNAME: $(AFD_DOWNLOAD_HOSTNAME)
      COSI_CONTAINER: $(COSI_CONTAINER)

  - task: AzureCLI@2
    inputs:
      azureSubscription: $(COSI_PMC_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        make -f packer.mk upload-cosi-to-pmc
    condition: and(succeeded(), eq(variables.GENERATE_PUBLISHING_INFO, 'True'))
    displayName: Upload COSI to PMC
    env:
      AFD_UPLOAD_ENDPOINT: $(AFD_UPLOAD_ENDPOINT)
      COSI_CONTAINER: $(COSI_CONTAINER)

  - task: PublishPipelineArtifact@1
    condition: and(succeeded(), eq(variables.GENERATE_PUBLISHING_INFO, 'True'))
    displayName: Publish COSI Publishing Info
    inputs:
      artifactName: 'cosi-publishing-info-${{ parameters.artifactName }}'
      targetPath: 'cosi-publishing-info.json'

  - task: AzureCLI@2
    inputs:
      azureSubscription: $(VHD_ARM_SERVICE_CONNECTION)
      scriptType: bash
      scriptLocation: inlineScript
      inlineScript: |
        echo "Copying ${DESTINATION_STORAGE_CONTAINER}/${CAPTURED_SIG_VERSION}.vhd to immutable storage container"
        export AZCOPY_AUTO_LOGIN_TYPE="AZCLI"
        export AZCOPY_CONCURRENCY_VALUE="AUTO"
        az storage blob copy start --account-name "$STORAGE_ACCOUNT_NAME" --destination-blob "${CAPTURED_SIG_VERSION}.vhd" --destination-container "$VHD_CONTAINER_NAME" --source-uri "${DESTINATION_STORAGE_CONTAINER}/${CAPTURED_SIG_VERSION}.vhd" --auth-mode login || exit 1
        echo "Successfully copied to immutable container"
        # Remove old VHD from staging container after copy to immutable container is complete
        azcopy remove "${DESTINATION_STORAGE_CONTAINER}/${CAPTURED_SIG_VERSION}.vhd" --recursive=true
    condition: |
      and(
        succeeded(),
        eq(variables.ENVIRONMENT, 'tme'),
        eq(variables.GENERATE_PUBLISHING_INFO, 'True')
      )
    displayName: Copy to Immutable Storage Container
