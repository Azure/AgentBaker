# Job template for ACL COSI conversion: converts the VHD staged by an ACL
# Build VHD job into a COSI, uploads it to PMC, publishes the publishing-info
# artifact, and copies the VHD to immutable storage.
#
# Runs as its own job (not inline in the Build VHD job) for BOTH amd64 and
# arm64, so the two architectures are handled identically -- only the pool
# differs, selected here from the architecture parameter. This was arm64-only
# for a while (x64 converted inline in the Build VHD job instead), because
# arm64 needed a native-arm64 pool: ImageCustomizer's btrfs subvolume ioctls
# are not supported under qemu-user emulation, so it can't run on the x64
# build pool. Now amd64 also gets its own job with the same shape, for
# consistency and to keep Build VHD jobs focused on just building the VHD.
#
# The convert pool(s) have no git, so every job from this template skips the
# built-in `checkout: self` and hydrates the workspace from a source bundle
# the build job publishes instead (see "Bundle/Publish source bundle for COSI
# convert" in .builder-release-template.yaml).
parameters:
  - name: jobName
    type: string
  - name: dependsOnJob
    type: string
  - name: architecture
    type: string
    values:
      - X86_64
      - ARM64
  - name: artifactName
    type: string
  - name: imgSku
    type: string
  - name: enableFips
    type: boolean
    default: false
  - name: publishCosi
    type: boolean
    default: true

jobs:
  - job: ${{ parameters.jobName }}
    condition: succeeded()
    dependsOn: ${{ parameters.dependsOnJob }}
    timeoutInMinutes: 120
    pool:
      ${{ if eq(parameters.architecture, 'ARM64') }}:
        name: $(NODE_SIG_TME_POOL_ARM64_NAME)
      ${{ else }}:
        name: $(POOL_NAME)
    variables:
      CAPTURED_SIG_VERSION: $[ dependencies.${{ parameters.dependsOnJob }}.outputs['exportCapturedSigVersion.CAPTURED_SIG_VERSION'] ]
      IMAGE_VERSION: $[ dependencies.${{ parameters.dependsOnJob }}.outputs['exportImageVersion.IMAGE_VERSION'] ]
      # Whatever the build job actually staged the VHD to (CLASSIC_BLOB, or
      # CLASSIC_BLOB_STAGING only when that job ran with ENVIRONMENT=='tme'
      # and GENERATE_PUBLISHING_INFO=='True') -- read back via output
      # variable instead of re-deriving it here, so this job can't diverge
      # from wherever the build job actually put the VHD.
      DESTINATION_STORAGE_CONTAINER: $[ dependencies.${{ parameters.dependsOnJob }}.outputs['exportDestinationStorageContainer.DESTINATION_STORAGE_CONTAINER'] ]
      SIG_IMAGE_NAME: $[ dependencies.${{ parameters.dependsOnJob }}.outputs['exportAclPublishSettings.SIG_IMAGE_NAME'] ]
      SIG_GALLERY_NAME: $[ dependencies.${{ parameters.dependsOnJob }}.outputs['exportAclPublishSettings.SIG_GALLERY_NAME'] ]
      PACKER_BUILD_LOCATION: $[ dependencies.${{ parameters.dependsOnJob }}.outputs['exportAclPublishSettings.PACKER_BUILD_LOCATION'] ]
      REPLICATIONS: $[ dependencies.${{ parameters.dependsOnJob }}.outputs['exportAclPublishSettings.REPLICATIONS'] ]
      IMG_CUSTOMIZER_CONTAINER: $[ dependencies.${{ parameters.dependsOnJob }}.outputs['exportAclPublishSettings.IMG_CUSTOMIZER_CONTAINER'] ]
      IMG_CUSTOMIZER_CONTAINER_FALLBACK: $[ dependencies.${{ parameters.dependsOnJob }}.outputs['exportAclPublishSettings.IMG_CUSTOMIZER_CONTAINER_FALLBACK'] ]
    steps:
      - checkout: none

      - bash: |
          echo '##vso[task.setvariable variable=OS_SKU]AzureContainerLinux'
          echo '##vso[task.setvariable variable=OS_VERSION]acl'
          echo '##vso[task.setvariable variable=IMG_SKU]${{ parameters.imgSku }}'
          echo '##vso[task.setvariable variable=HYPERV_GENERATION]V2'
          echo '##vso[task.setvariable variable=FEATURE_FLAGS]None'
          echo '##vso[task.setvariable variable=ARCHITECTURE]${{ parameters.architecture }}'
          echo '##vso[task.setvariable variable=ENABLE_FIPS]${{ parameters.enableFips }}'
          echo '##vso[task.setvariable variable=ENABLE_TRUSTED_LAUNCH]True'
        displayName: Setup Build Variables

      # This pool's image is minimal, so bootstrap every tool the convert flow
      # needs: docker (privileged), az CLI, azcopy, make/tar/curl, and Go.
      # Idempotent via `command -v` guards, so it's a no-op on any tool that's
      # already present (e.g. if a future pool image preinstalls some of
      # these). Already architecture-generic: package manager and azcopy
      # binary are both selected from the running agent's own `uname -m`.
      - bash: |
          set -euo pipefail
          echo "==== Bootstrapping tooling on $(uname -a) ===="

          if command -v apt-get >/dev/null 2>&1; then
              PKG=apt
          elif command -v tdnf >/dev/null 2>&1; then
              PKG=tdnf
          elif command -v dnf >/dev/null 2>&1; then
              PKG=dnf
          else
              echo "##vso[task.logissue type=error]No supported package manager (apt/tdnf/dnf) on this agent"
              exit 1
          fi
          echo "Package manager: $PKG"

          sudo -n true >/dev/null 2>&1 || {
              echo "##vso[task.logissue type=error]This agent user does not have passwordless sudo; cannot install tools"
              exit 1
          }

          pkg_install() {
              case "$PKG" in
                  apt)  sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends "$@" ;;
                  tdnf) sudo tdnf install -y "$@" ;;
                  dnf)  sudo dnf install -y "$@" ;;
              esac
          }

          if [ "$PKG" = apt ]; then
              sudo DEBIAN_FRONTEND=noninteractive apt-get update -y
          fi

          # Baseline utilities used by scripts and downloads below.
          pkg_install ca-certificates curl tar gnupg make jq

          # cosi-upload is built with `GOEXPERIMENT=ms_nocgo_opensslcrypto CGO_ENABLED=0`
          # (see packer.mk build-cosi-upload), matching every other Go binary in this
          # repo. That keeps FIPS/OpenSSL crypto compliance while avoiding a build-time
          # C toolchain, so no gcc/binutils/libc/OpenSSL-dev packages are needed here.

          # git isn't used by the convert scripts, but install it so any implicit
          # agent-side cleanup checkouts don't tank the job.
          if ! command -v git >/dev/null 2>&1; then
              pkg_install git
          fi

          # Docker (must support --privileged for ImageCustomizer's loopback mounts).
          if ! command -v docker >/dev/null 2>&1; then
              case "$PKG" in
                  apt)       pkg_install docker.io ;;
                  tdnf|dnf)  pkg_install moby-engine moby-cli || pkg_install docker ;;
              esac
          fi
          sudo systemctl start docker 2>/dev/null || sudo service docker start 2>/dev/null || true
          # Give the agent user access to the docker socket for the duration of the job.
          sudo chown "$(id -u):$(id -g)" /var/run/docker.sock 2>/dev/null || true
          docker version

          # Azure CLI.
          if ! command -v az >/dev/null 2>&1; then
              case "$PKG" in
                  apt)
                      # Install azure-cli from the pinned Microsoft apt repository so the
                      # install path is auditable and versionable (avoids piping a remote
                      # script into `sudo bash`).
                      pkg_install ca-certificates curl gnupg apt-transport-https lsb-release
                      sudo install -d -m 0755 /etc/apt/keyrings
                      tmp="$(mktemp -d)"
                      curl -fsSL https://packages.microsoft.com/keys/microsoft.asc -o "$tmp/microsoft.asc"
                      gpg --dearmor < "$tmp/microsoft.asc" > "$tmp/microsoft.gpg"
                      sudo install -m 0644 "$tmp/microsoft.gpg" /etc/apt/keyrings/microsoft.gpg
                      rm -rf "$tmp"
                      AZ_DIST="$(lsb_release -cs)"
                      echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/microsoft.gpg] https://packages.microsoft.com/repos/azure-cli/ ${AZ_DIST} main" \
                          | sudo tee /etc/apt/sources.list.d/azure-cli.list >/dev/null
                      sudo apt-get update
                      pkg_install azure-cli
                      ;;
                  tdnf|dnf)  pkg_install azure-cli ;;
              esac
          fi
          az version

          # azcopy static binary.
          if ! command -v azcopy >/dev/null 2>&1; then
              # azureedge.net CDN was retired; azcopy releases are served from GitHub.
              case "$(uname -m)" in
                  aarch64|arm64)
                      AZCOPY_URL=https://github.com/Azure/azure-storage-azcopy/releases/download/v10.22.1/azcopy_linux_arm64_10.22.1.tar.gz
                      AZCOPY_SHA256=4db9a4b48abc7775f1a5d6d928afc42361dcc57bbfcde23ac82e4c419a0dc8fc
                      ;;
                  *)
                      AZCOPY_URL=https://github.com/Azure/azure-storage-azcopy/releases/download/v10.22.1/azcopy_linux_amd64_10.22.1.tar.gz
                      AZCOPY_SHA256=7549424d56ab2d8b4033c84c2a9bb167dc2dcbb23998acd7fffb37bc1a71a267
                      ;;
              esac
              tmp="$(mktemp -d)"
              curl -fsSL "$AZCOPY_URL" -o "$tmp/azcopy.tgz"
              echo "$AZCOPY_SHA256  $tmp/azcopy.tgz" | sha256sum --check --status
              tar -xzf "$tmp/azcopy.tgz" -C "$tmp"
              # extracted dir is like azcopy_linux_arm64_10.x.x/
              azcopy_bin="$(find "$tmp" -maxdepth 2 -type f -name azcopy | head -n1)"
              if [ -z "$azcopy_bin" ] || [ ! -x "$azcopy_bin" ]; then
                  echo "##vso[task.logissue type=error]azcopy archive did not contain an executable binary"
                  exit 1
              fi
              sudo install -m 0755 "$azcopy_bin" /usr/local/bin/azcopy
              rm -rf "$tmp"
          fi
          azcopy --version

          # Go is needed to build cosi-upload.
          # On apt-based agents, install the repo-pinned Go toolchain after sources are extracted.
          if ! command -v go >/dev/null 2>&1; then
              if [ "$PKG" = apt ]; then
                  echo "Go not found yet; will install pinned version after source extraction"
              else
                  pkg_install golang
              fi
          fi
          command -v go >/dev/null 2>&1 && go version || true

          echo "==== Tooling bootstrap complete ===="
        displayName: Bootstrap convert tooling

      - task: DownloadPipelineArtifact@2
        displayName: Download AgentBaker source bundle
        inputs:
          artifact: agentbaker-sources-${{ parameters.artifactName }}
          path: $(Pipeline.Workspace)/agentbaker-sources

      - bash: |
          set -euo pipefail
          mkdir -p "$(Build.SourcesDirectory)"
          tar -xzf "$(Pipeline.Workspace)/agentbaker-sources/agentbaker-sources.tar.gz" -C "$(Build.SourcesDirectory)"
          ls "$(Build.SourcesDirectory)"
          cd "$(Build.SourcesDirectory)"
          if command -v apt-get >/dev/null 2>&1; then
              ./hack/setup_golang.sh
          fi
          go version
        displayName: Hydrate workspace from source bundle

      - bash: |
          SKU_NAME=${OS_VERSION} && \
          if [[ "${HYPERV_GENERATION,,}" == "v2" ]]; then SKU_NAME="${SKU_NAME}gen2"; fi && \
          if [[ "${ARCHITECTURE,,}" == "arm64" ]]; then SKU_NAME="${SKU_NAME}arm64"; fi && \
          if grep -q "NVIDIA_GB" <<< "$FEATURE_FLAGS"; then SKU_NAME="${SKU_NAME}gb"; fi && \
          if [[ "${ENABLE_FIPS,,}" == "true" ]]; then SKU_NAME="${SKU_NAME}fips"; fi && \
          if grep -q "cvm" <<< "$FEATURE_FLAGS"; then SKU_NAME="${SKU_NAME}CVM"; fi && \
          if [[ "${IMG_SKU}" == *"minimal"* ]]; then SKU_NAME="${SKU_NAME}minimal"; fi && \
          if [[ "${ENABLE_TRUSTED_LAUNCH}" == "True" ]]; then SKU_NAME="${SKU_NAME}TL"; fi && \
          SKU_NAME=$(echo ${SKU_NAME} | tr -d '.') && \
          echo "##vso[task.setvariable variable=SKU_NAME]$SKU_NAME"
          echo "Set SKU_NAME to $SKU_NAME"
        displayName: Set SKU Name

      - task: AzureCLI@2
        inputs:
          azureSubscription: $(VHD_ARM_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            make -f packer.mk convert-vhd-to-cosi
        condition: succeeded()
        displayName: Convert ACL VHD to COSI
        env:
          RESOURCE_GROUP_NAME: $(AZURE_RESOURCE_GROUP_NAME)
          OFFER_NAME: $(OS_SKU)
          IMG_CUSTOMIZER_ALLOW_FALLBACK: "true"
          AFD_DOWNLOAD_HOSTNAME: $(AFD_DOWNLOAD_HOSTNAME)
          COSI_CONTAINER: $(COSI_CONTAINER)
          GENERATE_COSI: ${{ parameters.publishCosi }}
          IMAGE_VERSION: $(IMAGE_VERSION)

      - task: DownloadPipelineArtifact@2
        condition: and(succeeded(), eq(variables.GENERATE_PUBLISHING_INFO, 'True'))
        displayName: Download ACL publishing input
        inputs:
          artifact: 'acl-vhd-publishing-input-${{ parameters.artifactName }}'
          path: '$(Build.SourcesDirectory)/acl-publishing-input'

      - task: AzureCLI@2
        inputs:
          azureSubscription: $(VHD_ARM_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            ./vhdbuilder/packer/imagecustomizer/scripts/publish-acl-image.sh
        displayName: Publish customized ACL SIG and E2E metadata
        env:
          RESOURCE_GROUP_NAME: $(AZURE_RESOURCE_GROUP_NAME)
          VHD_ARTIFACT_NAME: ${{ parameters.artifactName }}
          E2E_METADATA_DIR: $(Build.ArtifactStagingDirectory)/e2e-vhd-metadata
          ACL_PUBLISHING_INPUT: $(Build.SourcesDirectory)/acl-publishing-input/vhd-publishing-info.json
          GENERATE_PUBLISHING_INFO: $(GENERATE_PUBLISHING_INFO)

      - task: PublishPipelineArtifact@1
        displayName: Publish customized ACL E2E VHD metadata
        inputs:
          artifactName: 'e2e-vhd-metadata-${{ parameters.artifactName }}-stage$(System.StageAttempt)-job$(System.JobAttempt)'
          targetPath: '$(Build.ArtifactStagingDirectory)/e2e-vhd-metadata/${{ parameters.artifactName }}.json'

      - task: PublishPipelineArtifact@1
        condition: and(succeeded(), eq(variables.GENERATE_PUBLISHING_INFO, 'True'))
        displayName: Publish customized ACL VHD publishing info
        inputs:
          artifactName: 'publishing-info-${{ parameters.artifactName }}'
          targetPath: 'vhd-publishing-info.json'

      - ${{ if eq(parameters.publishCosi, true) }}:
        - task: AzureCLI@2
          inputs:
            azureSubscription: $(COSI_PMC_SERVICE_CONNECTION)
            scriptType: bash
            scriptLocation: inlineScript
            inlineScript: |
              make -f packer.mk upload-cosi-to-pmc
          condition: succeeded()
          displayName: Upload COSI to PMC
          env:
            AFD_UPLOAD_ENDPOINT: $(AFD_UPLOAD_ENDPOINT)
            COSI_CONTAINER: $(COSI_CONTAINER)

        - task: PublishPipelineArtifact@1
          condition: succeeded()
          displayName: Publish COSI Publishing Info
          inputs:
            artifactName: 'cosi-publishing-info-${{ parameters.artifactName }}'
            targetPath: 'cosi-publishing-info.json'

      - task: AzureCLI@2
        inputs:
          azureSubscription: $(VHD_ARM_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            set -euo pipefail
            if [[ "${DESTINATION_STORAGE_CONTAINER%/}" == "${CLASSIC_BLOB%/}" ]]; then
              echo "Customized VHD is already in its final container"
              exit 0
            fi
            export AZCOPY_AUTO_LOGIN_TYPE="AZCLI"
            export AZCOPY_CONCURRENCY_VALUE="AUTO"
            azcopy copy "${DESTINATION_STORAGE_CONTAINER}/${CAPTURED_SIG_VERSION}.vhd" "${CLASSIC_BLOB}/${CAPTURED_SIG_VERSION}.vhd" --blob-type=PageBlob --overwrite=false
            azcopy remove "${DESTINATION_STORAGE_CONTAINER}/${CAPTURED_SIG_VERSION}.vhd" --recursive=true
        condition: succeeded()
        displayName: Copy to Immutable Storage Container
