parameters:
  - name: name
    type: string
    displayName: Additional name for the pipeline step
    default: ""
  - name: IgnoreScenariosWithMissingVhd
    type: boolean
    displayName: Ignore tests where the VHD can't be loaded
  - name: variableGroup
    type: string
    displayName: Variable group to use for e2e tests
    default: ab-e2e
  - name: subscriptionId
    type: string
    displayName: Subscription ID override to use for E2E tests (empty = use variable group default)
    default: ""
  - name: failedTestsRetryCount
    type: number
    displayName: Number of times to retry failed E2E tests
    default: 0
  - name: jobTimeoutInMinutes
    type: number
    displayName: Maximum duration of the E2E job
    default: 90
  - name: randomNBCCoverage
    type: boolean
    displayName: Add random NBC-command scenarios per active Linux OS/version
    default: false
  - name: useVhdMetadataArtifacts
    type: boolean
    displayName: Resolve VHDs from metadata artifacts produced by this pipeline
    default: false
  - name: bootTraceMatrix
    type: boolean
    displayName: Run all 21 boot-trace CA matrix scenarios in three balanced waves
    default: false
  - name: rcv1pTagsAutoInjected
    type: boolean
    displayName: |
      Set to true when the target subscription auto-injects the RCV1P opt-in VMSS tag
      (platformsettings.host_environment.service.platform_optedin_for_rootcerts).
      When true, RCV1P negative tests (e.g. RCV1P_Windows_NotOptedIn) are skipped
      because they cannot verify the not-opted-in behavior on such subscriptions.
      Msft tenant E2E subs auto-inject; the RCV1P subscription does not.
    default: true
  - name: COSI_ARTIFACT_NAMES
    type: object
    displayName: List of COSI publishing info pipeline artifact names to download. Leave empty to skip COSI validation.
    default: []
  - name: ACL_BASE_IMAGE_SOURCE
    type: string
    default: acg
    values:
      - acg
      - acldevel

jobs:
  - job: e2e
    condition: and(succeeded(), ne(variables.SKIP_E2E_TESTS, 'true'))
    variables:
      - group: ${{parameters.variableGroup}} # all variables prefixed with E2E_* come from this variable group
      - name: COSI_ARTIFACTS_DIR
        value: ""
    pool:
      name: $(E2E_POOL_NAME)
    timeoutInMinutes: ${{ parameters.jobTimeoutInMinutes }}
    displayName: Run AgentBaker E2E ${{parameters.name}}
    steps:
      - checkout: self
        # s is the default path for repositories - if we don't set this when using multiple repsositories, then it is the repo name
        # "s/AgentBaker", but most of the pipeline variables still refer to "s" and many of the scripts below fail.
        path: s
        fetchTags: false
        fetchDepth: 1

      - ${{ if gt(length(parameters.COSI_ARTIFACT_NAMES), 0) }}:
        - bash: |
            echo "##vso[task.setvariable variable=COSI_ARTIFACTS_DIR]$(Pipeline.Workspace)/cosi-info/$(Build.BuildId)-$(System.JobAttempt)"
            echo "##vso[task.setvariable variable=TEST_TIMEOUT_VMSS]${TEST_TIMEOUT_VMSS:-30m}"
          displayName: Set COSI artifact directory
          condition: and(succeeded(), eq(variables.ENVIRONMENT, 'tme'), eq(variables.GENERATE_PUBLISHING_INFO, 'True'))

      - ${{ each ARTIFACT_NAME in parameters.COSI_ARTIFACT_NAMES }}:
        - task: DownloadPipelineArtifact@2
          displayName: "Download COSI info: ${{ ARTIFACT_NAME }}"
          condition: and(succeeded(), eq(variables.ENVIRONMENT, 'tme'), eq(variables.GENERATE_PUBLISHING_INFO, 'True'))
          inputs:
            artifact: "${{ ARTIFACT_NAME }}"
            path: "$(COSI_ARTIFACTS_DIR)/${{ ARTIFACT_NAME }}"

      - ${{ if eq(parameters.useVhdMetadataArtifacts, true) }}:
        - task: DownloadPipelineArtifact@2
          displayName: Download E2E VHD metadata
          inputs:
            buildType: current
            itemPattern: 'e2e-vhd-metadata-*/**/*.json'
            targetPath: $(Pipeline.Workspace)/e2e-vhd-metadata

        - bash: |
            set -euo pipefail

            metadata_dir="$(Pipeline.Workspace)/e2e-vhd-metadata"
            metadata_file="$(Build.SourcesDirectory)/e2e-vhd-metadata.json"
            # Pipeline artifacts are immutable, so rerun attempts publish uniquely suffixed
            # artifacts. Sort naturally by attempt so metadata from the latest attempt wins.
            mapfile -d '' metadata_files < <(find "$metadata_dir" -type f -name '*.json' -print0 | sort -zV)
            if [ "${#metadata_files[@]}" -eq 0 ]; then
              echo "##vso[task.logissue type=error]No E2E VHD metadata artifacts were downloaded" >&2
              exit 1
            fi

            jq -s 'reduce .[] as $item ({}; . * $item)' "${metadata_files[@]}" > "$metadata_file"
            echo "##vso[task.setvariable variable=E2E_VHD_METADATA_FILE]$metadata_file"
          displayName: Merge E2E VHD metadata

      - ${{ if parameters.bootTraceMatrix }}:
        - bash: |
            set -euo pipefail
            target="$(Pipeline.Workspace)/boot-trace-rust"
            mkdir -p "$target"
            docker run --rm --user "$(id -u):$(id -g)" \
              -e CARGO_HOME=/tmp/cargo -e CARGO_TARGET_DIR=/target \
              -e 'RUSTFLAGS=-C target-feature=+crt-static --remap-path-prefix=/src=.' \
              -v "$(Build.SourcesDirectory)/e2e/boot-trace/update-ca-certificates-rs:/src:ro" \
              -v "$target:/target" rust:1.85.1-bookworm@sha256:e51d0265072d2d9d5d320f6a44dde6b9ef13653b035098febd68cce8fa7c0bc4 \
              cargo build --manifest-path /src/Cargo.toml --release --frozen --offline \
                --target x86_64-unknown-linux-gnu
            python3 -B e2e/boot-trace/prepare_matrix.py \
              --binary "$target/x86_64-unknown-linux-gnu/release/update-ca-certificates-rs" \
              --metadata "$(E2E_VHD_METADATA_FILE)" \
              --output "$(Pipeline.Workspace)/boot-trace-matrix"
            python3 - <<'PY'
            import json
            from pathlib import Path
            manifest = json.loads(Path("$(Pipeline.Workspace)/boot-trace-matrix/fixture.json").read_text())
            print("##vso[task.setvariable variable=BOOT_TRACE_MATRIX_TAGS]" +
                  ",".join("Name=" + name for name in manifest["scenario_names"]))
            PY
          displayName: Build and verify versioned inputs for all 21 boot-trace tests

      - template: ./.acl-base-image-signed-vars.yaml
        parameters:
          ACL_BASE_IMAGE_SOURCE: ${{ parameters.ACL_BASE_IMAGE_SOURCE }}

      - task: AzureCLI@2
        inputs:
          azureSubscription: $(E2E_ARM_SERVICE_CONNECTION)
          scriptType: bash
          scriptLocation: inlineScript
          inlineScript: |
            bash .pipelines/scripts/e2e_run.sh
        displayName: Run AgentBaker E2E
        env:
          SYS_SSH_PUBLIC_KEY: $(SYS_SSH_PUBLIC_KEY)
          SYS_SSH_PRIVATE_KEY_B64: $(SYS_SSH_PRIVATE_KEY_B64)
          BUILD_SRC_DIR: $(System.DefaultWorkingDirectory)
          DefaultWorkingDirectory: $(Build.SourcesDirectory)
          VHD_BUILD_ID: $(VHD_BUILD_ID)
          SUBSCRIPTION_ID_OVERRIDE: ${{parameters.subscriptionId}}
          IGNORE_SCENARIOS_WITH_MISSING_VHD: ${{parameters.IgnoreScenariosWithMissingVhd}}
          E2E_FAILED_TESTS_RETRY_COUNT: ${{parameters.failedTestsRetryCount}}
          E2E_RANDOM_NBC_COVERAGE: ${{parameters.randomNBCCoverage}}
          ${{ if eq(parameters.randomNBCCoverage, true) }}:
            BUILD_ID: $(Build.BuildId)
          RCV1P_TAGS_AUTO_INJECTED: ${{parameters.rcv1pTagsAutoInjected}}
          ${{ if eq(parameters.useVhdMetadataArtifacts, true) }}:
            E2E_VHD_METADATA_FILE: $(E2E_VHD_METADATA_FILE)
          COSI_ARTIFACTS_DIR: $(COSI_ARTIFACTS_DIR)
          ACL_BASE_IMAGE_SIGNED: $(ACL_BASE_IMAGE_SIGNED)
          ${{ if parameters.bootTraceMatrix }}:
            E2E_BOOT_TRACE: "true"
            E2E_BOOT_TRACE_MATRIX_DIR: $(Pipeline.Workspace)/boot-trace-matrix
            E2E_BOOT_TRACE_WAVES: "true"
            E2E_PARALLEL: "7"
            E2E_GO_TEST_TIMEOUT: "180m"
            E2E_RESOURCE_GROUP_PREFIX: abe2e-ca-$(Build.BuildId)-$(System.JobAttempt)
            BLOB_STORAGE_ACCOUNT_PREFIX: bt$(Build.BuildId)$(System.JobAttempt)
            DEFAULT_VM_SKU: Standard_D2ds_v5
            TAGS_TO_RUN: $(BOOT_TRACE_MATRIX_TAGS)
            TAGS_TO_SKIP: ""

      - ${{ if parameters.bootTraceMatrix }}:
        - bash: |
            set -euo pipefail
            if [ -f "$(Build.SourcesDirectory)/e2e/report.xml" ]; then
              cp "$(Build.SourcesDirectory)/e2e/report.xml" "$(Pipeline.Workspace)/boot-trace-matrix/junit.xml"
            else
              echo "##vso[task.logissue type=warning]No JUnit results: the boot-trace runner did not complete"
            fi
          displayName: Retain matrix inputs and test outcomes
          condition: succeededOrFailed()
        - publish: $(Pipeline.Workspace)/boot-trace-matrix
          artifact: boot-trace-matrix-inputs
          displayName: Publish reproducible matrix inputs
          condition: succeededOrFailed()

      - task: PublishTestResults@2
        displayName: Upload test results
        condition: succeededOrFailed()
        inputs:
          testRunner: JUnit
          testResultsFiles: "$(Build.SourcesDirectory)/e2e/report.xml"

      - publish: $(System.DefaultWorkingDirectory)/e2e/$(LOGGING_DIR)
        displayName: Upload scenario logs
        artifact: $(LOGGING_DIR)
        condition: always()
        continueOnError: true
