# POC: force cloud-init to use the NoCloud datasource only.
#
# Azure Local / AKS Arc "VM Everywhere" nodes are Hyper-V guests that receive
# their CAPI bootstrap bytes via a NoCloud seed ISO (volume label "cidata",
# user-data = CAPI bootstrap, meta-data = instance-id + static net) produced by
# AKS-InfraX/AKSWinAgent. Pinning the datasource to NoCloud prevents cloud-init
# from probing the Azure IMDS/wireserver datasource (which does not exist
# on-prem) and guarantees the seed.iso is honoured on first boot.
datasource_list: [ NoCloud, None ]
