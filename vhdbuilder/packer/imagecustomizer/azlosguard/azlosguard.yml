os:
  additionalFiles:
    - source: /AgentBaker/parts/common/components.json
      destination: /opt/azure/components.json
      permissions: 644
    - source: /AgentBaker/vhdbuilder/packer/prefetch.sh
      destination: /opt/azure/containers/prefetch.sh
      permissions: 755
    - source: /AgentBaker/image-fetcher/bin/image-fetcher-linux-amd64
      destination: /opt/azure/containers/image-fetcher
      permissions: 755
    - source: /AgentBaker/aks-node-controller/bin/aks-node-controller-linux-amd64
      destination: /opt/azure/containers/aks-node-controller
      permissions: 755

previewFeatures:
  - uki
  - reinitialize-verity

scripts:
  postCustomization:
    - path: scripts/azlosguard-postinstall.sh
      environmentVariables:
        IMG_SKU: "azure-linux-osguard-3"
        SKU_NAME: "OSGuardV3gen2fipsTL"
        FEATURE_FLAGS: ""
