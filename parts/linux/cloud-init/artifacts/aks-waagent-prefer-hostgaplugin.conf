# Installed as a drop-in for both walinuxagent.service (Ubuntu) and waagent.service (Azure Linux).
# The custom data feature marker is written by cloud-init, so make sure it has run before the
# pre-start hook checks for it. The hook is a no-op unless PREFER_HOSTGAPLUGIN is enabled.
[Unit]
After=cloud-init.service

[Service]
ExecStartPre=-/usr/bin/python3 /opt/azure/containers/aks-waagent-prefer-hostgaplugin.py
