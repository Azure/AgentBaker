[Service]
# Every setting the agent reads is pinned, including those matching its current
# defaults, so an upstream default change cannot silently alter AKS behaviour.
# Review these when the Trident version in the base image moves.

# Agent default is acl.microsoft.com; the AKS contract uses acl.azure.com. A
# mismatch is silent: the RP writes a key the agent never watches.
Environment="TRIDENT_ACL_AGENT_KUBERNETES_ANNOTATION_PREFIX=acl.azure.com"
Environment="TRIDENT_ACL_AGENT_KUBERNETES_KUBECONFIG=/var/lib/kubelet/kubeconfig"

# tridentd's gRPC socket. Without it the agent falls back to the Trident CLI,
# whose finalize reboots before a terminal status can be written.
Environment="TRIDENT_ACL_AGENT_TRIDENT_SOCKET=unix:///run/trident/trident.sock"

Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_MODE=annotations"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_STATE_PATH=/var/lib/trident-acl-agent/state.json"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_STAGE_TIMEOUT=20m"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_FINALIZE_TIMEOUT=10m"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_HEARTBEAT_INTERVAL=60s"
Environment="TRIDENT_ACL_AGENT_ORCHESTRATION_COOKIE_ENABLED=true"

# The root-partition stamp survives A/B updates of /usr and is not the active
# version. Use a sentinel until Trident has an updatable version source; this
# deliberately disables current-version-based AlreadyAtTarget shortcuts.
Environment="TRIDENT_ACL_AGENT_CURRENT_VERSION_PATH=/dev/null"
Environment="TRIDENT_ACL_AGENT_CURRENT_VERSION_KEY=IMAGE_VERSION"
Environment="TRIDENT_ACL_AGENT_CURRENT_VERSION_FALLBACK=0.0.0"

# Not set: NODE_NAME and API_SERVER are per-node and per-cluster and default
# correctly; NEBRASKA_* is unused in annotation mode.

StateDirectory=trident-acl-agent

# Trident before 0.29 exits cleanly until kubelet registers the Node. Restart it
# after a pause so path unit re-triggers can't hit systemd's start limit.
Restart=always
RestartSec=5

# Diagnostics only. Each of these absences makes the agent behave differently,
# and this records which one in the journal that is collected on failure.
ExecStartPre=-/usr/bin/sh -c '\
for p in /var/lib/kubelet/kubeconfig /run/trident/trident.sock; do \
  [ -e "$p" ] && echo "trident-acl-agent preflight: present $p" || echo "trident-acl-agent preflight: MISSING $p"; \
done'

# Wait for kubelet TLS bootstrapping without polling the API server.
TimeoutStartSec=150s
ExecStartPre=/usr/bin/sh -c '\
cert=/var/lib/kubelet/pki/kubelet-client-current.pem; \
for i in $$(seq 1 60); do \
  if [ -f /var/lib/kubelet/kubeconfig ] && [ -L "$$cert" ] && [ -f "$$cert" ]; then \
    echo "trident-acl-agent preflight: kubelet TLS bootstrapping complete after $$i check(s)"; exit 0; \
  fi; \
  sleep 1; \
done; \
echo "trident-acl-agent preflight: kubelet TLS bootstrapping incomplete after 60 checks" >&2; \
exit 1'

# TLS bootstrapping can finish before Node registration. Wait locally, then
# confirm the Node exists with one API request.
ExecStartPre=/usr/bin/timeout 60s /usr/bin/sh -ec '\
until journalctl -b -u kubelet.service --no-pager -q -o cat \
    --grep="Successfully registered node" -n 1 | grep -q .; do \
  sleep 1; \
done; \
sleep 1; \
node="$$(hostname | tr "[:upper:]" "[:lower:]")"; \
/opt/bin/kubectl --kubeconfig /var/lib/kubelet/kubeconfig \
  --request-timeout=5s get node "$$node" >/dev/null; \
echo "trident-acl-agent preflight: Node $$node registration confirmed"'
