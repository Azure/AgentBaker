[Service]
# Makes systemd enable the cpu controller in this unit's cgroup subtree, so
# /sys/fs/cgroup/localdns.slice/localdns.service/cpu.stat exists for the CPU metrics
# localdns.sh exports.
Delegate=cpu

# Pinned here rather than in localdns.service, because it cannot work there.
#
# Azure Linux ships a type-wide drop-in at
# /usr/lib/systemd/system/service.d/10-timeout-abort.conf setting
# TimeoutStopFailureMode=abort (Fedora's "Shorter Shutdown Timer"), and systemd.unit(5)
# states drop-ins take precedence over unit files wherever located. Verified with the real
# files: unit file alone -> terminate; plus the type-wide 10- file -> abort; plus this
# drop-in -> terminate.
#
# With abort in effect a stop timeout sends SIGABRT to capture a core dump, then waits a
# SECOND TimeoutStopSec in 'stop-watchdog' before SIGKILL, doubling the stop side of the
# restart cycle. Measured on AzureLinuxV3: 90 + 30 + 30 + 2 = 153s, above the 144s
# threshold (StartLimitIntervalSec/StartLimitBurst), so the slow failure modes would
# restart forever there -- exactly what the budget exists to prevent. Pinned back to the
# systemd default the cycle is 90 + 30 + 2 = 122s on every image we ship.
#
# The core dump the abort step exists to produce is already discarded on AKS nodes:
# configureCoreDump() in cis.sh sets Storage=none and ProcessSizeMax=0 for every distro
# (it runs before the Mariner/AzureLinux early return in applyCIS), asserted by
# testCoreDumpSettings in linux-vhd-content-test.sh. So today that step costs 30s of
# restart cycle and produces nothing. If that hardening is ever relaxed, revisit this --
# the 30s would have to be bought back elsewhere in the cycle or the threshold widened, or
# Azure Linux goes back over 144s.
TimeoutStopFailureMode=terminate
