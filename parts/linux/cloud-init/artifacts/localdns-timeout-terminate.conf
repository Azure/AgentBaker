# Installed to /etc/systemd/system/localdns.service.d/99-timeout-terminate.conf.
#
# This directive cannot live in localdns.service. Azure Linux ships a type-wide drop-in at
# /usr/lib/systemd/system/service.d/10-timeout-abort.conf setting
# TimeoutStopFailureMode=abort, and systemd.unit(5) states that drop-ins take precedence
# over unit files wherever located. Setting it in the unit is silently ignored there.
#
# With abort in effect, a stop timeout sends SIGABRT to capture a core dump and then waits
# a SECOND TimeoutStopSec in 'stop-watchdog' before SIGKILL. That doubles the stop side of
# the restart cycle: measured on AzureLinuxV3, 90 + 30 + 30 + 2 = 153s, above the 144s
# threshold (StartLimitIntervalSec/StartLimitBurst in localdns.service). Slow failure modes
# would then restart forever instead of reaching 'failed' -- exactly what that budget exists
# to prevent. Pinned back to the systemd default the cycle is 90 + 30 + 2 = 122s everywhere.
#
# A unit-specific drop-in wins over a type-wide one because they are separate hierarchies
# and systemd applies the unit-specific one last -- not because of the 99- prefix. Verified:
# a type-wide file named 99- (sorting after this one) still loses. The prefix is for human
# readers, so this file reads as "applied late, on purpose".
#
# Kept separate from delegate.conf rather than folded into it: that file is named for
# Delegate=cpu, and whoever comes back asking why the stop timeout behaves this way will not
# think to open a file about cgroup delegation.
#
# The core dump abort exists to produce is already discarded on AKS nodes -- configureCoreDump()
# in cis.sh sets Storage=none and ProcessSizeMax=0 for every distro, asserted by
# testCoreDumpSettings in linux-vhd-content-test.sh. So today that step costs 30s of restart
# cycle and produces nothing. If that hardening is relaxed, revisit: the 30s would have to be
# bought back elsewhere in the cycle or the threshold widened, or Azure Linux goes back
# over 144s.
[Service]
TimeoutStopFailureMode=terminate
