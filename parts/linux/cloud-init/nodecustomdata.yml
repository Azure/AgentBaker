{{- else if IsAzlOSGuard}}
- path: {{GetCSEInstallScriptDistroFilepath}}
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "provisionInstallsAzlOSGuard" | GetCloudInitFileContent}}
{{- else if IsMariner}}
- path: {{GetCSEInstallScriptDistroFilepath}}
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "provisionInstallsMariner" | GetCloudInitFileContent}}
{{- else if IsFlatcar }}
- path: {{GetCSEInstallScriptDistroFilepath}}
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "provisionInstallsFlatcar" | GetCloudInitFileContent}}
{{- else }}
- path: {{GetCSEInstallScriptDistroFilepath}}
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "provisionInstallsUbuntu" | GetCloudInitFileContent}}
{{end}}

- path: {{GetCSEConfigScriptFilepath}}
