#cloud-config

bootcmd:
- |
  mkdir -p /opt/bin
  for bin in aks-secure-tls-bootstrap-client ci-syslog-watcher.sh logrotate.sh; do
    [ -e /opt/bin/${bin} ] && continue
    [ -e /usr/local/bin/${bin} ] || continue
    ln -s /usr/local/bin/${bin} /opt/bin/
  done

write_files:
# IMPORTANT: OSGuard images have /usr/ mounted read-only (dm-verity).
# All write_files entries must target /opt/ or /etc/ paths only.
# If a /usr/ path is ever needed for non-OSGuard distros, guard it with:
#   {{ if not IsAzlOSGuard }}
#   - path: /usr/...
#   {{ end }}
{{if EnableScriptlessCSECmd}}
- path: /opt/azure/containers/scriptless-cse-overrides.txt
  permissions: "0644"
  owner: root
  content: |
    Executing in scriptless CSE mode. No cloud-init scripts will be written to the VM.
    Any overridden files will be listed here - Hotfix mode
    Example: {{GetCSEHelpersScriptFilepath}}

{{if IsAKSCustomCloud}}
- path: {{GetInitAKSCloudFilepath}}
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "initAKSCloud" | GetCloudInitFileContent}}
{{end}}

{{- else }}
- path: {{GetCSEHelpersScriptFilepath}}
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "provisionSource" | GetCloudInitFileContent}}


{{if IsACL }}
- path: {{GetCSEHelpersScriptDistroFilepath}}
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "provisionSourceACL" | GetCloudInitFileContent}}
{{- else if IsAzlOSGuard}}
- path: {{GetCSEHelpersScriptDistroFilepath}}
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "provisionSourceAzlOSGuard" | GetCloudInitFileContent}}
{{- else if IsMariner}}
- path: {{GetCSEHelpersScriptDistroFilepath}}
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "provisionSourceMariner" | GetCloudInitFileContent}}
{{- else if IsFlatcar }}
- path: {{GetCSEHelpersScriptDistroFilepath}}
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "provisionSourceFlatcar" | GetCloudInitFileContent}}
{{- else }}
- path: {{GetCSEHelpersScriptDistroFilepath}}
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "provisionSourceUbuntu" | GetCloudInitFileContent}}
{{end}}

{{ if not IsCustomImage -}}
- path: /opt/azure/containers/provision_start.sh
  permissions: "0744"
  encoding: {{GetCloudInitFileEncoding}}
  owner: root
  content: {{GetVariableProperty "cloudInitData" "provisionStartScript" | GetCloudInitFileContent}}
{{- end }}

- path: /opt/azure/containers/provision.sh
  permissions: "0744"
