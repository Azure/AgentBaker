#cloud-config

bootcmd:
- |
  mkdir -p /opt/bin
  for bin in aks-secure-tls-bootstrap-client ci-syslog-watcher.sh logrotate.sh; do
    [ -e /opt/bin/${bin} ] && continue
    [ -e /usr/local/bin/${bin} ] || continue
    ln -s /usr/local/bin/${bin} /opt/bin/
  done

write_files:
# IMPORTANT: OSGuard images have /usr/ mounted read-only (dm-verity).
# All write_files entries must target /opt/ or /etc/ paths only.
# If a /usr/ path is ever needed for non-OSGuard distros, guard it with:
#   {{ if not IsAzlOSGuard }}
#   - path: /usr/...
#   {{ end }}
{{if EnableScriptlessCSECmd}}
- path: /opt/azure/containers/scriptless-cse-overrides.txt
  permissions: "0644"
  owner: root
  content: |
    Executing in scriptless CSE mode. No cloud-init scripts will be written to the VM.
    Any overridden files will be listed here - Hotfix mode
    Example: {{GetCSEHelpersScriptFilepath}}

{{if IsAKSCustomCloud}}
- path: {{GetInitAKSCloudFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "initAKSCloud"}}
{{end}}

{{- else }}
- path: {{GetCSEHelpersScriptFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionSource"}}


{{if IsACL }}
- path: {{GetCSEHelpersScriptDistroFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionSourceACL"}}
{{- else if IsAzlOSGuard}}
- path: {{GetCSEHelpersScriptDistroFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionSourceAzlOSGuard"}}
{{- else if IsMariner}}
- path: {{GetCSEHelpersScriptDistroFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionSourceMariner"}}
{{- else if IsFlatcar }}
- path: {{GetCSEHelpersScriptDistroFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionSourceFlatcar"}}
{{- else }}
- path: {{GetCSEHelpersScriptDistroFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionSourceUbuntu"}}
{{end}}

{{ if not IsCustomImage -}}
- path: /opt/azure/containers/provision_start.sh
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionStartScript"}}
{{- end }}

- path: /opt/azure/containers/provision.sh
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionScript"}}

- path: {{GetCSEInstallScriptFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionInstalls"}}

{{if IsACL }}
- path: {{GetCSEInstallScriptDistroFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionInstallsACL"}}
{{- else if IsAzlOSGuard}}
- path: {{GetCSEInstallScriptDistroFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionInstallsAzlOSGuard"}}
{{- else if IsMariner}}
- path: {{GetCSEInstallScriptDistroFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionInstallsMariner"}}
{{- else if IsFlatcar }}
- path: {{GetCSEInstallScriptDistroFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionInstallsFlatcar"}}
{{- else }}
- path: {{GetCSEInstallScriptDistroFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionInstallsUbuntu"}}
{{end}}

- path: {{GetCSEConfigScriptFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionConfigs"}}

- path: {{GetCSEConfigGPUScriptFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionConfigsGPU"}}

- path: {{GetCSEConfigLocalDNSScriptFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionConfigsLocalDNS"}}

- path: {{GetCSEConfigKubeletScriptFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionConfigsKubelet"}}

- path: {{GetCSEConfigNetworkScriptFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionConfigsNetwork"}}

- path: {{GetCSEConfigAddonsScriptFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionConfigsAddons"}}

- path: {{GetCSEConfigChronyScriptFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "provisionConfigsChrony"}}

{{if IsAKSCustomCloud}}
- path: {{GetInitAKSCloudFilepath}}
  permissions: "0744"
  owner: root
{{GetCloudInitFileProperties "initAKSCloud"}}
{{end}}

- path: /etc/systemd/system/reconcile-private-hosts.service
  permissions: "0644"
  owner: root
{{GetCloudInitFileProperties "reconcilePrivateHostsService"}}

- path: /etc/systemd/system/kubelet.service
  permissions: "0600"
  owner: root
{{GetCloudInitFileProperties "kubeletSystemdService"}}

- path: /opt/azure-network/configure-azure-network.sh
  permissions: "0755"
  owner: root
{{GetCloudInitFileProperties "configureAzureNetworkScript"}}

- path: /etc/udev/rules.d/99-azure-network.rules
  permissions: "0644"
  owner: root
{{GetCloudInitFileProperties "azureNetworkUdevRule"}}
{{- end }}
