syntax = "proto3";
package aksnodeconfig.v1;

option go_package = "github.com/Azure/agentbaker/aks-node-controller/pkg/gen/aksnodeconfig/v1;aksnodeconfigv1";

message ContainerdConfig {
  // The base URL for downloading containerd.
  string containerd_download_url_base = 1;

  // The version of containerd to download.
  string containerd_version = 2;

  // The URL for downloading the containerd package.
  string containerd_package_url = 3;

  // Force filesystem synchronization during image unpacking. Absence preserves
  // the existing setting. Enabling this may select local pulls on containerd 2.x.
  optional bool image_pull_with_sync_fs = 4;

  // Maximum time without image download progress, in Go duration format.
  // Zero disables the timeout. Absence preserves the existing setting.
  optional string image_pull_progress_timeout = 5;
}
