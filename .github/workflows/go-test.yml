name: Go Unit Tests
on: pull_request

jobs:
  go-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        # Compatibility tests in aks-node-controller create git worktrees at
        # historical commits. Full history avoids relying on runtime `git fetch`
        # of those commits, which is flaky on the default shallow checkout.
        fetch-depth: 0
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version: '1.25'
    - run: |
        set -ex
        make test
      name: Run unit tests for go code in the repository

  e2e-unit-test:
    # e2e is a separate Go module, so `make test` in the root module does not reach it. Run the
    # e2e tests that need neither Azure credentials nor network so they gate pull requests.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: e2e/go.mod
        cache-dependency-path: e2e/go.sum
    - name: Run iptables allowlist unit tests
      working-directory: ./e2e
      run: |
        set -ex
        go test -v -run '^Test_iptables' .
