name: govulncheck (Publish)
# Posts govulncheck-pr.yml findings as a PR comment. workflow_run reads this file from the
# default branch, so a PR cannot change it. See go-test-publish.yml for the full reasoning.
on: # zizmor: ignore[dangerous-triggers] no PR code is checked out or executed here; only the report text from the completed run is posted.
  workflow_run:
    workflows: ["govulncheck (PR)"]
    types:
      - completed

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.pull_requests[0] != null
    permissions:
      actions: read
      pull-requests: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: govulncheck-*
          merge-multiple: true
          path: report
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: report
        run: |
          if ls report/*.md >/dev/null 2>&1; then
            cat report/*.md > comment.md
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi
      # One comment for each PR: updated on new findings, deleted when the findings are fixed.
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        with:
          number: ${{ github.event.workflow_run.pull_requests[0].number }}
          header: govulncheck
          path: ${{ steps.report.outputs.found == 'true' && 'comment.md' || '' }}
          delete: ${{ steps.report.outputs.found != 'true' }}
