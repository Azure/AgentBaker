name: Hotfix Template Update
# Auto-detects whether a hotfix is needed for a PR targeting an official/* release
# branch and, if so, computes the version numbers and updates the generated files:
#   - If aks-node-controller/ changed vs the base branch, bumps `version`.
#   - Changed CSE scripts are generated into both the legacy CRP nodecustomdata
#     block and an ANC-owned embedded payload during phase 1. Retire the legacy
#     path only after 15 supported-version rotations and confirmation that the
#     oldest supported ABSvc/VHD release is embedded-capable. If
#     nodecustomdata.yml changes, bumps `scripts_version`.
#   - Writes the result to
#     parts/linux/cloud-init/artifacts/aks-node-controller-hotfix.json (embedded
#     directly into scriptless customData by pkg/agent/baker.go).
#
# See hotfix/hotfix_generate.py for the full algorithm.
#
# Triggers:
# 1. Automatically when a PR targets an official/* release branch
# 2. Manually when a "hotfix" label is added to any PR
#
# pull_request_target(types:[labeled]) is required so a manually-applied
# "hotfix" label can trigger this with write-capable credentials on PRs from
# forks/branches; the job's `if:` below gates on same-repo origin plus an
# explicit human-applied label.
on: # zizmor: ignore[dangerous-triggers] see comment above
  pull_request:
    branches:
      - 'official/**'
    types: [opened, synchronize, reopened]
  pull_request_target:
    types: [labeled]

permissions:
  id-token: write
  contents: read
  pull-requests: read

jobs:
  hotfix-generate:
    # Run if: PR targets official/* branch, OR "hotfix" label was just added (same-repo PRs only)
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event_name == 'pull_request' && startsWith(github.base_ref, 'official/')) ||
        (github.event_name == 'pull_request_target' && github.event.label.name == 'hotfix')
      )
    runs-on: ubuntu-latest
    environment: test
    steps:
      - name: Azure login
        uses: azure/login@f5d393ae46f8fde4be8b75f32e3fc50e654ad0ca # v3.0.1
        with:
          client-id: ${{ secrets.AZURE_KV_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_KV_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_KV_SUBSCRIPTION_ID }}

      - name: Retrieve App private key
        uses: azure/cli@9eb25b8360668fb0ecbafa808d40e2197b2f5f52 # v3
        id: app-private-key
        with:
          azcliversion: latest
          inlineScript: |
            private_key=$(az keyvault secret show --vault-name ${{ secrets.AZURE_KV_NAME }} -n ${{ secrets.APP_PRIVATE_KEY_SECRET_NAME }} --query value -o tsv | sed 's/$/\\n/g' | tr -d '\n' | head -c -2) &> /dev/null
            echo "::add-mask::$private_key"
            echo "private-key=$private_key" >> $GITHUB_OUTPUT

      - name: Generate App token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        id: app-token
        with:
          app-id: ${{ vars.APP_ID }}
          private-key: ${{ steps.app-private-key.outputs.private-key }}
          repositories: AgentBaker
          permission-contents: write

      - name: Checkout PR branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false

      - name: Fetch base branch
        run: git fetch origin "${GITHUB_BASE_REF}"

      - name: Generate hotfix files
        run: |
          python3 -m unittest hotfix.hotfix_generate_test
          python3 hotfix/hotfix_generate.py "origin/${GITHUB_BASE_REF}"

      - name: Commit changes via API
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          FILES=()
          while IFS= read -r STATUS_LINE; do
            FILES+=("${STATUS_LINE:3}")
          done < <(
            git status --porcelain --untracked-files=all -- \
              parts/linux/cloud-init/nodecustomdata.yml \
              parts/linux/cloud-init/artifacts/aks-node-controller-hotfix.json \
              aks-node-controller/scripthotfix/generated
          )
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "No template changes needed."
            exit 0
          fi

          REPOSITORY="repos/${{ github.repository }}"
          BRANCH="${GITHUB_HEAD_REF}"
          CHECKOUT_SHA=$(git rev-parse HEAD)
          START_SHA=$(gh api "${REPOSITORY}/git/ref/heads/${BRANCH}" --jq '.object.sha')
          if [ "$START_SHA" != "$CHECKOUT_SHA" ]; then
            echo "Branch moved after checkout; refusing to commit stale generated content." >&2
            exit 1
          fi
          BASE_TREE=$(gh api "${REPOSITORY}/git/commits/${START_SHA}" --jq '.tree.sha')
          TREE='[]'
          for FILE in "${FILES[@]}"; do
            if [ -e "$FILE" ]; then
              BLOB_SHA=$(
                base64 -w 0 "$FILE" |
                  jq -Rs '{content: ., encoding: "base64"}' |
                  gh api "${REPOSITORY}/git/blobs" -X POST --input - --jq '.sha'
              )
              TREE=$(
                jq -c \
                  --arg path "$FILE" \
                  --arg sha "$BLOB_SHA" \
                  '. + [{path: $path, mode: "100644", type: "blob", sha: $sha}]' \
                  <<< "$TREE"
              )
            else
              TREE=$(
                jq -c \
                  --arg path "$FILE" \
                  '. + [{path: $path, mode: "100644", type: "blob", sha: null}]' \
                  <<< "$TREE"
              )
            fi
          done
          NEW_TREE=$(
            jq -n \
              --arg base_tree "$BASE_TREE" \
              --argjson tree "$TREE" \
              '{base_tree: $base_tree, tree: $tree}' |
              gh api "${REPOSITORY}/git/trees" -X POST --input - --jq '.sha'
          )
          NEW_COMMIT=$(
            jq -n \
              --arg message "chore: auto-generate hotfix content" \
              --arg tree "$NEW_TREE" \
              --arg parent "$START_SHA" \
              '{message: $message, tree: $tree, parents: [$parent]}' |
              gh api "${REPOSITORY}/git/commits" -X POST --input - --jq '.sha'
          )
          CURRENT_SHA=$(gh api "${REPOSITORY}/git/ref/heads/${BRANCH}" --jq '.object.sha')
          if [ "$CURRENT_SHA" != "$START_SHA" ]; then
            echo "Branch moved during generation; refusing to overwrite ${CURRENT_SHA}." >&2
            exit 1
          fi
          jq -n \
            --arg sha "$NEW_COMMIT" \
            '{sha: $sha, force: false}' |
            gh api "${REPOSITORY}/git/refs/heads/${BRANCH}" -X PATCH --input -
