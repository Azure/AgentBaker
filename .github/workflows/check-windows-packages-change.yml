name: Make windows components change PR review comment
on: pull_request

jobs:
  compare-components-output:
    name: Compare components.json and windows_settings.json for each windows VHD
    runs-on: windows-latest
    permissions:
      pull-requests: write
    steps:
      - name: Check out repository code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Use base.ref (e.g. "main"), not base.sha: base.sha is frozen at
          # whatever the base branch pointed to during this PR's last
          # opened/synchronize event. If the base branch advances afterward
          # without a new push to this PR, base.sha goes stale and this diff
          # ends up comparing against outdated base content, surfacing
          # unrelated upstream changes as if they came from the PR. base.ref
          # always resolves to the live tip of the base branch at checkout time.
          ref: ${{ github.event.pull_request.base.ref }}
          path: base
          fetch-depth: 1
          persist-credentials: false

      - name: Check out repository code
        id: checkoutPrMerge
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # refs/pull/<N>/merge is GitHub's continuously-updated test-merge
          # commit of the PR head into the *current* base tip. This differs
          # from the default (ref omitted) checkout behavior, which pins to
          # github.sha from the triggering event — frozen at whatever main
          # was during this PR's last opened/synchronize event. GitHub
          # deletes this ref when the PR has a merge conflict with the
          # current base branch, which makes this checkout fail; that case
          # is handled below instead of failing the whole job.
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          path: pr
          fetch-depth: 1
          persist-credentials: false

      - name: Produce vhd files - base
        id: makeDiff
        shell: pwsh
        run: |
          cd pr
          $DIFF_DIR="vhd_files"

          mkdir -Force "${DIFF_DIR}"

          pwsh -c vhdbuilder/scripts/windows/generate_cached_stuff_list.ps1 "${DIFF_DIR}" vhdbuilder/packer/windows/components_json_helpers.ps1 ../base/vhdbuilder/packer/windows/windows_settings.json ../base/parts/common/components.json

          git add "${DIFF_DIR}"
          git config user.email "you@example.com"
          git config user.name "Your Name"
          git commit -m "versions of files from PR base"

          pwsh -c vhdbuilder/scripts/windows/generate_cached_stuff_list.ps1 "${DIFF_DIR}" vhdbuilder/packer/windows/components_json_helpers.ps1 vhdbuilder/packer/windows/windows_settings.json parts/common/components.json

          $diffFile = "../diff.md"
          git diff --quiet -- "${DIFF_DIR}"
          if ( $LASTEXITCODE -eq "0" ) {
            # This line is commented out to reduce noise in the PRs
            # Write-Output "No changes to cached containers or packages on Windows VHDs" > $diffFile
          } else {
            Write-Output "### Changes cached containers or packages on windows VHDs" > $diffFile
            Write-Output "Please get a Windows SIG member to approve." >> $diffFile
            Write-Output "" >> $diffFile
            Write-Output "The following dif file shows any additions or deletions from what will be cached on windows VHDs organised by VHD type." >> $diffFile
            Write-Output "* Additions are new things cached." >> $diffFile
            Write-Output "* Deletions are things no longer cached." >> $diffFile
            Write-Output "" >> $diffFile
            Write-Output "" >> $diffFile
            Write-Output '```diff' >> $diffFile
            git diff --unified=0 -- "${DIFF_DIR}" >> $diffFile
            Write-Output '```' >> $diffFile

            dir $diffFile
            Get-Content $diffFile
          }

      - name: remove comment from PR
        # Removing and then adding the comment means that the comment will always appear at the bottom of the PR.
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          mode: delete
          comment-tag: 'WINDOWS_VHD_CONTENT_DIFF'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}

      - name: Add comment to PR
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        if: ${{ hashFiles('diff.md') != '' }}
        with:
          file-path: 'diff.md'
          comment-tag: 'WINDOWS_VHD_CONTENT_DIFF'
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
