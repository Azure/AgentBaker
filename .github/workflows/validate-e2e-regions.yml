name: validate-e2e-regions
on: pull_request

# The e2e module is not covered by `make test`, which runs `go test ./...` from the repo root
# and does not cross module boundaries. Without this workflow the generated replication region
# list could drift from the scenarios and a test would fail with GalleryImageNotFound instead.
jobs:
  validate-e2e-regions:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
      with:
        go-version-file: e2e/go.mod
    - run: |
        make validate-e2e-regions
      name: Verify the gallery replication region list matches the scenarios
    - run: |
        cd e2e && go test ./config/... ./hack/...
      name: Run e2e region and generator unit tests
