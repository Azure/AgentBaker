name: AKS Diagnostic Compatibility Tests
on:
  pull_request:
    paths:
      - 'parts/linux/cloud-init/artifacts/aks-diagnostic.py'
      - 'parts/linux/cloud-init/artifacts/test_aks_diagnostic.py'
      - '.github/requirements/aks-diagnostic-tests.txt'
      - '.github/workflows/aks-diagnostic-tests.yml'

permissions: {}

jobs:
  compatibility:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        python-version: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install test dependencies
        run: python -m pip install -r .github/requirements/aks-diagnostic-tests.txt
      - name: Test legacy and environment-variable invocations
        run: python -m pytest parts/linux/cloud-init/artifacts/test_aks_diagnostic.py -v --hypothesis-show-statistics
