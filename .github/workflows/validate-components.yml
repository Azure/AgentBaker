name: Validate Components
on: pull_request

jobs:
  cue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Install cue
        run: |
          go version
          GOPATH="$(go env | grep GOPATH | cut -d= -f2 | tr -d '"')"
          export PATH="$PATH:$GOPATH/bin"
          pushd /tmp
          GO111MODULE=on go install cuelang.org/go/cmd/cue@v0.15.4
          popd

      - name: Validate components.json conforms to cue schema
        run: |
          set -ex
          GOPATH="$(go env | grep GOPATH | cut -d= -f2 | tr -d '"')"
          export PATH="$PATH:$GOPATH/bin"
          cue vet -c ./schemas/components.cue ./parts/common/components.json

      - name: Validate windows_settings.json conforms to cue schema
        run: |
          set -ex
          GOPATH="$(go env | grep GOPATH | cut -d= -f2 | tr -d '"')"
          export PATH="$PATH:$GOPATH/bin"
          cue vet -c ./schemas/windows_settings.cue ./vhdbuilder/packer/windows/windows_settings.json

      - name: Validate components-test.json conforms to cue schema
        run: |
          set -ex
          GOPATH="$(go env | grep GOPATH | cut -d= -f2 | tr -d '"')"
          export PATH="$PATH:$GOPATH/bin"
          cue vet -c ./schemas/components.cue ./vhdbuilder/packer/windows/components-test.json

  version-consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: e2e/go.mod
        cache-dependency-path: e2e/go.sum
    - name: Run GPU managed components version consistency test
      working-directory: ./e2e
      run: |
        set -ex
        go test -v -run ^TestVersionConsistencyGPUManagedComponents$ ./scenario

  dcgm-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: e2e/go.mod
        cache-dependency-path: e2e/go.sum
    - name: Verify DCGM Exporter package compatibility
      working-directory: ./e2e
      run: |
        set -ex
        go test -v -tags=dcgmcompat ./components/

  previous-version-consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Only k8sVersion-keyed entries (kubectl/kubelet and their *-sysext
    # siblings) can go stale here: latestVersion and previousLatestVersion
    # must reference two different Kubernetes patch releases. Renovate can
    # bump latestVersion but has no logic to detect that a package/image
    # rebuild left both fields pointing at the same Kubernetes patch, so
    # this check catches that case and recommends the correct value.
    # It never edits components.json; a human must apply the fix.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate previousLatestVersion targets the prior Kubernetes patch
        run: |
          set -ex
          python3 .github/scripts/validate_previous_version.py \
            --base "origin/${{ github.event.pull_request.base.ref }}" \
            --file parts/common/components.json
