name: Validate Components
on: pull_request

jobs:
  cue:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
      - name: Install cue
        run: |
          go version
          GOPATH="$(go env | grep GOPATH | cut -d= -f2 | tr -d '"')"
          export PATH="$PATH:$GOPATH/bin"
          pushd /tmp
          GO111MODULE=on go install cuelang.org/go/cmd/cue@v0.15.4
          popd

      - name: Validate components.json conforms to cue schema
        run: |
          set -ex
          GOPATH="$(go env | grep GOPATH | cut -d= -f2 | tr -d '"')"
          export PATH="$PATH:$GOPATH/bin"
          cue vet -c ./schemas/components.cue ./parts/common/components.json

      - name: Validate windows_settings.json conforms to cue schema
        run: |
          set -ex
          GOPATH="$(go env | grep GOPATH | cut -d= -f2 | tr -d '"')"
          export PATH="$PATH:$GOPATH/bin"
          cue vet -c ./schemas/windows_settings.cue ./vhdbuilder/packer/windows/windows_settings.json

      - name: Validate components-test.json conforms to cue schema
        run: |
          set -ex
          GOPATH="$(go env | grep GOPATH | cut -d= -f2 | tr -d '"')"
          export PATH="$PATH:$GOPATH/bin"
          cue vet -c ./schemas/components.cue ./vhdbuilder/packer/windows/components-test.json

  version-consistency:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: e2e/go.mod
        cache-dependency-path: e2e/go.sum
    - name: Run GPU managed components version consistency test
      working-directory: ./e2e
      run: |
        set -ex
        go test -v -run ^TestVersionConsistencyGPUManagedComponents$ ./scenario

  dcgm-compatibility:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: e2e/go.mod
        cache-dependency-path: e2e/go.sum
    - name: Verify DCGM Exporter package compatibility
      working-directory: ./e2e
      run: |
        set -ex
        go test -v -tags=dcgmcompat ./components/

  previous-version-consistency:
    runs-on: ubuntu-latest
    # This check only targets Renovate-authored version bumps: Renovate is
    # the actor that copies latestVersion -> previousLatestVersion without
    # noticing a same-release collision, so that's where this failure mode
    # actually originates.
    if: github.event.pull_request.user.login == 'renovate[bot]'
    permissions:
      contents: read
      pull-requests: write
    # Any entry in components.json tracking both latestVersion and
    # previousLatestVersion can go stale: the two fields must reference two
    # genuinely different releases. Renovate can bump latestVersion but has
    # no logic to detect that a package/image rebuild left both fields
    # pointing at the same release (only differing by package/image
    # revision), so this check catches that case and posts a best-effort
    # recommendation. It never edits components.json; a human must apply
    # the fix.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate previousLatestVersion targets a genuinely prior release
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          set -ex
          python3 .github/scripts/validate_previous_version.py \
            --base "origin/${BASE_REF}" \
            --file parts/common/components.json \
            --report previous_version_report.md \
            --suggestions previous_version_suggestions.json

      - name: Post previousLatestVersion suggestions as review comments
        # Always run (even when this push has no findings): a prior push's
        # suggestions may since have been fixed and need to be cleaned up.
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -ex
          python3 .github/scripts/post_suggestions.py \
            --repo "${{ github.repository }}" \
            --pr "${{ github.event.pull_request.number }}" \
            --commit-sha "${{ github.event.pull_request.head.sha }}" \
            --file parts/common/components.json \
            --suggestions previous_version_suggestions.json

      - name: remove previousLatestVersion comment from PR
        # Removing and then re-adding keeps the comment at the bottom of the
        # PR and avoids piling up duplicate comments on repeated pushes.
        if: always()
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          mode: delete
          comment-tag: PREVIOUS_LATEST_VERSION_CHECK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: comment previousLatestVersion findings on PR
        if: always() && hashFiles('previous_version_report.md') != ''
        uses: thollander/actions-comment-pull-request@24bffb9b452ba05a4f3f77933840a6a841d1b32b # v3.0.1
        with:
          file-path: previous_version_report.md
          comment-tag: PREVIOUS_LATEST_VERSION_CHECK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
