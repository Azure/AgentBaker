name: Windows Unit Test Results (Publish)

# Publishes the test-results check/comment and coverage comment produced by
# validate-windows-ut.yml's pester-test job, from a workflow_run trigger rather than a
# second job in that same pull_request-triggered workflow.
#
# Why: validate-windows-ut.yml is a `pull_request` workflow, so its *entire file* - every
# job, every permission - is read from the PR's own branch. A same-repo PR (this repo
# doesn't accept forks, so that's the only kind we get) can edit that file to add steps to
# any job in it, including a "publish" job, and have them run with whatever permissions that
# job requests. Splitting into two jobs in one file only stops PR-controlled *test code*
# (PowerShell, in this case) from reaching a write-scoped token in the same job - it does
# nothing against a PR editing the workflow definition itself.
#
# workflow_run is what actually fixes this: this file's definition is always read from the
# default branch, never the PR branch, no matter what the PR changes. It runs after
# validate-windows-ut.yml completes, downloads that run's artifacts by run ID, and does the
# actual publishing here, where the PR can't alter it.
on:
  workflow_run:
    workflows: ["Windows Powershell Unit Test"]
    types:
      - completed

permissions: {}

jobs:
  publish-results:
    name: Publish test results and coverage report
    runs-on: ubuntu-latest
    if: |
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure')
    permissions:
      contents: read
      checks: write
      pull-requests: write
      actions: read
    steps:
      - name: Download test results and coverage reports
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pester-coverage
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Download event file
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: pester-event-file
          path: event
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Publish Unit Test Results
        # The default (Docker) entry point's action.yml resolves to a floating
        # `docker://ghcr.io/enricomi/publish-unit-test-result-action:v2.24.0` tag even when
        # pinned to a commit SHA here, so pinning the SHA doesn't actually pin what runs. The
        # `linux` composite entry point has no such indirection - it's plain steps executed
        # directly at this commit, so the SHA pin is meaningful. ubuntu-latest doesn't need
        # Docker for it; that variant exists specifically for runners without Docker.
        uses: EnricoMi/publish-unit-test-result-action/linux@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2.24.0
        with:
          commit: ${{ github.event.workflow_run.head_sha }}
          event_file: event/event.json
          event_name: ${{ github.event.workflow_run.event }}
          check_name: Windows Unit Test Results
          files: |
            test-results/parts_windows.xml
            test-results/vhdbuilder_packer_windows.xml
            test-results/staging_cse_windows.xml

      - name: Code Coverage Report
        # irongut/CodeCoverageSummary's action.yml resolves to docker://ghcr.io/irongut/
        # codecoveragesummary:v1.3.0 even when the action is pinned to a commit SHA - that's
        # a mutable tag, so the SHA pin doesn't actually pin what runs with checks/pull-requests
        # write. Invoke the image by digest directly instead of going through the action.
        run: |
          set -ex
          docker run --rm \
            -v "${GITHUB_WORKSPACE}:/github/workspace" \
            -w /github/workspace \
            ghcr.io/irongut/codecoveragesummary@sha256:daebdede906ca84788b94378a1504a88d38621198d3836df24d60d6215e64a86 \
            --files "coverage/*.xml" \
            --badge true \
            --fail false \
            --format markdown \
            --hidebranch false \
            --hidecomplexity true \
            --indicators true \
            --output both \
            --thresholds "60 80"

      - name: Add Coverage PR Comment
        if: github.event.workflow_run.pull_requests[0] != null
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        with:
          number: ${{ github.event.workflow_run.pull_requests[0].number }}
          header: pester-coverage
          recreate: true
          path: code-coverage-results.md
