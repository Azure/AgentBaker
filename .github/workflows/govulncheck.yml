name: govulncheck
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions: {}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        module: [., aks-live-patching, aks-node-controller, e2e, image-fetcher, vhdbuilder/prefetch]
    env:
      MODULE: ${{ matrix.module }}
    steps:
      - id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The workflow runs from the default branch (dev); scan the released code.
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: '**/go.sum'
      - shell: bash # Adds pipefail, so a govulncheck error fails the step.
        run: |
          # govulncheck reports paths relative to the module (e.g. "go.mod", "../pkg/x.go" in e2e).
          # Make them relative to the repository root so alerts link to the correct file.
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -C "$MODULE" -format sarif ./... |
            jq --arg m "$MODULE" '
              def norm: split("/") | reduce .[] as $s ([]; if $s == ".." then .[:-1] elif $s == "." or $s == "" then . else . + [$s] end) | join("/");
              (.. | objects | select(.uriBaseId? == "%SRCROOT%") | .uri) |= ("\($m)/\(.)" | norm)' > govulncheck.sarif
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck-${{ matrix.module }}
          ref: refs/heads/main
          sha: ${{ steps.checkout.outputs.commit }}
