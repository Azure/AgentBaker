name: govulncheck
on:
  schedule:
    - cron: '0 6 * * *'

permissions: {}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        module: [., aks-live-patching, aks-node-controller, e2e, image-fetcher, vhdbuilder/prefetch]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Scheduled runs use the default branch (dev); scan the released code.
          ref: main
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: '**/go.sum'
      - id: scan
        env:
          MODULE: ${{ matrix.module }}
        run: |
          go run golang.org/x/vuln/cmd/govulncheck@v1.10.0 -C "$MODULE" -format sarif ./... > govulncheck.sarif
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: govulncheck.sarif
          category: govulncheck-${{ matrix.module }}
          ref: refs/heads/main
          sha: ${{ steps.scan.outputs.sha }}
