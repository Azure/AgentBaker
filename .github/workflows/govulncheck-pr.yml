name: govulncheck (PR)
# Read-only scan. govulncheck-publish.yml posts the PR comment, because a pull_request
# workflow is read from the PR branch and must not hold write scopes.
on:
  pull_request:
    paths:
      - '**/go.mod'
      - '**/go.sum'
      - .github/workflows/govulncheck-pr.yml

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        module: [., aks-live-patching, aks-node-controller, e2e, image-fetcher, vhdbuilder/prefetch]
    env:
      MODULE: ${{ matrix.module }}
      JOB_INDEX: ${{ strategy.job-index }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27'
          cache-dependency-path: '**/go.sum'
      # Install instead of `go run`: `go run` turns every failure into exit 1, hiding govulncheck's exit 3.
      - run: go install golang.org/x/vuln/cmd/govulncheck@v1.10.0
      # Exit code 3 means reachable vulnerabilities: write a report, do not fail. Other errors fail the job.
      - run: |
          mkdir report
          rc=0
          govulncheck -C "$MODULE" ./... > out.txt 2>&1 || rc=$?
          cat out.txt
          if [ "$rc" -eq 3 ]; then
            { echo "**govulncheck** found reachable vulnerabilities in \`$MODULE\`:"; echo '```'; head -c 20000 out.txt; echo '```'; } > "report/$JOB_INDEX.md"
          elif [ "$rc" -ne 0 ]; then
            exit "$rc"
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-${{ strategy.job-index }}
          path: report
          if-no-files-found: ignore
          retention-days: 5
