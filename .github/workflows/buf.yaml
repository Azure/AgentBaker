name: Buf CI
on:
  push:
    paths:
      - "aks-node-controller/proto/**"
      - "aks-node-controller/buf.yaml"
      - "aks-node-controller/.buf-version"
      - "aks-live-patching/proto/**"
      - "aks-live-patching/buf.yaml"
      - ".github/workflows/buf.yaml"
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    paths:
      - "aks-node-controller/proto/**"
      - "aks-node-controller/buf.yaml"
      - "aks-node-controller/.buf-version"
      - "aks-live-patching/proto/**"
      - "aks-live-patching/buf.yaml"
      - ".github/workflows/buf.yaml"
permissions:
  contents: read
  pull-requests: write
jobs:
  buf:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Read buf version
        id: buf-version
        run: echo "version=$(cat aks-node-controller/.buf-version)" >> "$GITHUB_OUTPUT"
      - uses: bufbuild/buf-action@v1
        with:
          input: aks-node-controller
          version: ${{ steps.buf-version.outputs.version }}
      - uses: bufbuild/buf-action@v1
        with:
          input: aks-live-patching
          # Reuses the buf version from aks-node-controller's Makefile
          version: ${{ steps.buf-version.outputs.version }}
